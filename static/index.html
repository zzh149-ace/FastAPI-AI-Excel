<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 全栈开发学习计划生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef2f7 0%, #d9e2f3 100%);
      min-height: 100vh;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(47, 84, 150, 0.15);
      padding: 32px 36px;
    }
    h1 {
      font-size: 22px;
      color: #2f5496;
      margin: 0 0 6px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin: 0 0 26px;
    }
    label.field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin: 18px 0 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus, select:focus {
      border-color: #4472c4;
    }
    .radio-group {
      display: flex;
      gap: 22px;
      font-size: 14px;
      color: #333;
    }
    .radio-group label { cursor: pointer; }
    .hint {
      font-size: 12px;
      color: #a0a0a0;
      margin-top: 4px;
    }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #2f5496;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #24447c; }
    button:disabled { background: #9db2d6; cursor: not-allowed; }
    #result { margin-top: 20px; font-size: 14px; line-height: 1.6; }
    .loading { color: #4472c4; text-align: center; }
    .rejected { color: #c0392b; background: #fdecea; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; }
    .success { color: #1e8449; background: #eafaf1; padding: 12px; border-radius: 8px; text-align: center; }
    .error { color: #c0392b; background: #fdecea; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI 全栈开发学习计划生成器</h1>
    <p class="subtitle">填写信息，一键生成个性化学习计划并导出 Excel</p>

    <form id="plan-form">
      <label class="field-label" for="name">姓名</label>
      <input type="text" id="name" placeholder="请输入姓名" />

      <label class="field-label">性别</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="男" /> 男</label>
        <label><input type="radio" name="gender" value="女" /> 女</label>
      </div>

      <label class="field-label" for="age">年龄</label>
      <input type="text" id="age" placeholder="请输入年龄（数字）" />

      <label class="field-label" for="education">学历</label>
      <select id="education">
        <option value="硕士及以上">硕士及以上</option>
        <option value="本科" selected>本科</option>
        <option value="专升本">专升本</option>
        <option value="专科">专科</option>
        <option value="其他">其他</option>
      </select>

      <label class="field-label" for="knowledge">知识基础</label>
      <input type="text" id="knowledge" placeholder="例：MySQL、C语言基础语法" />
      <div class="hint">无基础统一填写：0基础</div>

      <label class="field-label" for="habit">学习习惯</label>
      <input type="text" id="habit" placeholder="例：早上昏昏欲睡，中午吃完饭犯困，晚上精神百倍" />

      <button type="submit" id="submit-btn">生成学习计划</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('plan-form');
    const btn = document.getElementById('submit-btn');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const genderEl = document.querySelector('input[name="gender"]:checked');
      const data = {
        name: document.getElementById('name').value.trim(),
        gender: genderEl ? genderEl.value : '',
        age: document.getElementById('age').value.trim(),
        education: document.getElementById('education').value,
        knowledge: document.getElementById('knowledge').value.trim(),
        habit: document.getElementById('habit').value.trim(),
      };

      btn.disabled = true;
      result.innerHTML = '<p class="loading">正在生成学习计划，请稍候…</p>';

      try {
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await resp.json();

        if (json.status === 'rejected') {
          result.innerHTML = '<p class="rejected">' + json.message + '</p>';
        } else if (json.status === 'success') {
          const tag = json.source === 'claude' ? 'AI 智能生成' : '演示模式生成';
          result.innerHTML =
            '<p class="success">✅ 学习计划生成成功（' + tag + '），正在下载 Excel 文件「' +
            json.filename + '」…</p>';
          window.location.href = json.download_url;
        } else {
          result.innerHTML = '<p class="error">' + (json.message || '未知错误') + '</p>';
        }
      } catch (err) {
        result.innerHTML = '<p class="error">请求失败：' + err.message + '</p>';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
